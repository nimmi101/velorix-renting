<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <!-- Red accent gradient -->
    <linearGradient id="red" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <!-- White-to-light gradient for the V letterform -->
    <linearGradient id="vfill" x1="14" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>

  <!-- Red accent bar (bottom) -->
  <rect x="0" y="55" width="64" height="9" rx="0" fill="url(#red)"/>
  <rect x="0" y="55" width="64" height="9" rx="13" fill="url(#red)"/>

  <!-- Bold "V" lettermark -->
  <!-- Left arm of V: goes from top-left down to bottom-center -->
  <polygon
    points="14,10  24,10  32,42  24,42"
    fill="url(#vfill)"
  />
  <!-- Right arm of V: goes from top-right down to bottom-center -->
  <polygon
    points="50,10  40,10  32,42  40,42"
    fill="url(#vfill)"
  />

  <!-- Red speed slash through the V – diagonal accent line -->
  <rect
    x="13" y="26"
    width="38" height="4.5"
    rx="2.2"
    fill="url(#red)"
    transform="rotate(-2 32 28)"
  />
</svg>